# =====================================================================
# render.yaml — Render の設定ファイル（Blueprint）
# Render の画面で「New → Blueprint」からこのリポジトリを選ぶと、この内容で自動構築される。
#
# ■ 無料プラン（free）で動かす前提の設定です
#   無料プランの制限（2026年11月時点・Render公式ドキュメントより）：
#     ・15分アクセスが無いとスリープし、次のアクセスで起動するまで約1分かかる
#     ・ファイルの保存先は一時的。再起動・再デプロイ・スリープのたびに
#       DB（SQLite）とアップロード写真が消える
#     ・永続ディスクは付けられない
#   → この環境は「デモ・動作確認用」と割り切り、データは
#     管理画面「データ連携」のエクスポートでバックアップ → 消えたら「復元」で戻す運用にする。
#     （README「2. Render に公開する」参照）
#
# ■ 有料プランに上げるとき
#   plan を starter にし、下のコメントの disk を有効にして、DATA_DIR を /var/data にする。
# =====================================================================
services:
  - type: web
    name: qr-story-mvp
    runtime: python
    plan: free
    region: singapore # 日本から近いリージョン
    buildCommand: pip install -r requirements.txt
    # gunicorn = 本番用のWebサーバー。"app:create_app()" は「app.py の create_app() を呼んで起動」の意味
    # --preload：起動処理（表の作成・初期ユーザー作成）を1回だけ行ってから、処理用プロセスを2つに増やす
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --preload
    healthCheckPath: /healthz
    # --- 有料プラン（starter 以上）にしたら有効にする ---
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: TZ
        value: Asia/Tokyo # 日時を日本時間で記録する
      # 再起動でDBが空になったら、サンプル商品を自動で入れ直す（デモがいつでも見られるように）。
      # 自分の商品を「復元」して使うようになったら false にする（サンプルが混ざらないように）
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: SECRET_KEY
        generateValue: true # Render がランダムな値を自動で作ってくれる
      - key: EDITOR_PASSWORD
        sync: false # 作成時に Render の画面で入力する（GitHubには書かない）
      - key: APPROVER_PASSWORD
        sync: false
